name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      tag:
        value: ${{ jobs.windows.outputs.tag }}

permissions:
  contents: read

jobs:
  windows:
    name: Windows checks and packages
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: |
          $unformatted = gofmt -l cmd internal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted) { throw "Run gofmt on: $unformatted" }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Verify generated Windows resources
        run: |
          pwsh -NoProfile -File scripts/update-resources.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- internal/win32
      - name: Build and package
        id: package
        run: |
          $tag = ./scripts/package.ps1
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/release-notes.md
          if-no-files-found: error
