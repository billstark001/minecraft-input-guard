name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: dist
      - name: Publish version and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          assets=("dist/MinecraftInputGuard-$RELEASE_TAG-windows-amd64.zip" "dist/MinecraftInputGuard-$RELEASE_TAG-windows-arm64.zip")
          for asset in "${assets[@]}" dist/release-notes.md; do
            test -s "$asset"
          done

          ref="refs/tags/$RELEASE_TAG"
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq ".[] | select(.ref == \"$ref\") | .object.sha")
          if [[ -z "$existing" ]]; then
            gh api "repos/$GH_REPO/git/refs" -f ref="$ref" -f sha="$GITHUB_SHA" --silent
          elif [[ "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" != "$GITHUB_SHA" ]]; then
            echo "$RELEASE_TAG already points to another commit." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "$RELEASE_TAG" --notes-file dist/release-notes.md
